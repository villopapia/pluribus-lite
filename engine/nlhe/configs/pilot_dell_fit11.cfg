# Pilot: identical structure to faithful.cfg (fold/call always legal, no multiway
# restriction, turn/river {0.5x, 1x, all-in} then {1x, all-in}); ONLY preflop/flop sizes
# reduced to the minimum (one open size and one flop bet size, all-in only above).
# See docs/deviations.md D-RES-2.

# 63 post-flop buckets (paper: 200) = the most that fits 11 GiB with first-use allocation.
name = pilot_dell_fit11
buckets = 169, 63, 63, 63
allin = true
limp = all
crowded_players = 0
river_method = on_the_fly
avg_strategy_streets = preflop
preflop.0 = 0.5
flop.0 = 0.5
turn.0 = 0.5, 1.0
turn.1+ = 1.0
river.0 = 0.5, 1.0
river.1+ = 1.0
