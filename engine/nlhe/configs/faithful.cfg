# Faithful blueprint structure (Brown & Sandholm 2019; docs/fidelity_spec.md section 2).
# Preflop/flop sizes: Pluribus' observed sizes via analysis/calibrate_sizes.py --theta 0.14,
# the threshold whose tree is closest to the paper's 664,845,654 action sequences:
# 718,732,473 (+8.1%). See docs/fidelity_report.md and docs/deviations.md D-ACT-1..4.
name = faithful
buckets = 169, 200, 200, 200
allin = true
limp = all
crowded_players = 0
river_method = on_the_fly
avg_strategy_streets = preflop
preflop.0 = 0.4, 0.5, 0.6
preflop.1 = 0.88, 1, 1.5, 2
preflop.2 = 0.5, 0.75, 0.88, 1
preflop.3+ = 1
flop.0 = 0.5, 1
flop.1 = 0.5, 1
flop.2+ = 1
turn.0 = 0.5, 1
turn.1+ = 1
river.0 = 0.5, 1
river.1+ = 1
