# Faithful blueprint structure (Brown & Sandholm 2019, supplement; see docs/fidelity_spec.md).
# - 169 lossless preflop, 200 buckets per post-flop round (p. 13)
# - fold and call always legal: no limp or multiway restrictions (p. 13)
# - turn/river: first raise {0.5x, 1x, all-in}, later raises {1x, all-in} (p. 12)
# - preflop/flop sizes: not published. Proxy = sizes Pluribus used in the 10,000 logged hands,
#   snapped to a fixed grid and kept if >= 2% (and >= 3) of bets at that raise depth
#   (docs/deviations.md D-ACT-1, D-ACT-2). Depths with no data: {1x} + all-in (D-ACT-3).
name = faithful
buckets = 169, 200, 200, 200
allin = true
limp = all
crowded_players = 0
river_method = on_the_fly
avg_strategy_streets = preflop
preflop.0 = 0.4, 0.5, 0.6, 0.75, 0.88, 1.0
preflop.1 = 0.5, 0.75, 0.88, 1.0, 1.25, 1.5, 2.0
preflop.2 = 0.5, 0.6, 0.75, 0.88, 1.0, 1.25
preflop.3+ = 1.0
flop.0 = 0.25, 0.5, 1.0, 2.0
flop.1 = 0.5, 1.0
flop.2+ = 1.0
turn.0 = 0.5, 1.0
turn.1+ = 1.0
river.0 = 0.5, 1.0
river.1+ = 1.0
